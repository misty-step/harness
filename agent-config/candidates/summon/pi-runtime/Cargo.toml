[package]
name = "summon-pi-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
fs2 = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
summon-http-client = { path = "../../mage/factory-http" }
summon-protocol = { path = "../factory/protocol" }
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "io-std"] }

[dev-dependencies]
tempfile = "3"
