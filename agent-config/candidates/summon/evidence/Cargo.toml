[package]
name = "summon-evidence"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"
ureq = { version = "3", default-features = false }
summon-protocol = { path = "../factory/protocol" }

[dev-dependencies]
tempfile = "3"
