[package]
name = "mage"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
fs2 = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
summon-http-client = { path = "factory-http" }
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "io-std", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
