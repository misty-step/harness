[package]
name = "summon-http-client"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
summon-protocol = { path = "../../summon/factory/protocol" }
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }
url = "=2.5.8"

[dev-dependencies]
tempfile = "3"
