# Foundation review gate (ADR-003 Review authority, US-027).
# Copy to .github/workflows/foundation-review.yml and set HARNESS_SHA to the
# harness revision the repository's foundation job pins.
#
# pull_request_target runs this file as it is on the base branch, so a PR cannot
# replace the gate that judges it. The job checks out the base branch only; the
# PR's commits are fetched as git objects, so none of its files are checked out
# or executed, and Bun starts outside the checkout. Review
# events cannot trigger pull_request_target, so after any review action (approve,
# request changes, escalate) the agent reviewer adds or removes a label to re-run
# the gate; the label itself grants nothing. Retargeting the base re-runs it too.
name: foundation-review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  foundation-review:
    runs-on: ubuntu-24.04
    env:
      HARNESS_SHA: "0000000000000000000000000000000000000000"
      BUN_URL: https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-linux-x64-baseline.zip
      BUN_SHA256: c678040f14fe0440eb839d37cbd0ce4c051a32da72806ac97de6a6aab6bf728f
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the pull request's commits as git objects
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The token reaches git through the environment, never argv, and is not persisted.
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          git fetch --quiet --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/foundation/pull-head"
      - name: Fetch pinned foundation checker and Bun
        run: |
          root="$RUNNER_TEMP/foundation"
          mkdir -p "$root/checker" "$root/runtime"
          git init --quiet --initial-branch=checker "$root/checker"
          git -C "$root/checker" fetch --quiet --no-tags --depth=1 https://github.com/misty-step/harness.git "$HARNESS_SHA"
          git -C "$root/checker" checkout --quiet --detach "$HARNESS_SHA"
          test "$(git -C "$root/checker" rev-parse HEAD)" = "$HARNESS_SHA"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --retry 3 --output "$root/runtime/bun.zip" "$BUN_URL"
          printf '%s  %s\n' "$BUN_SHA256" "$root/runtime/bun.zip" | sha256sum --check --strict
          unzip -q "$root/runtime/bun.zip" -d "$root/runtime"
      - name: Require the designated reviewer where a PR needs one
        # Run Bun from the trusted checker directory: Bun loads bunfig.toml (including preload scripts)
        # from its working directory, so it must never start inside the checkout under review.
        working-directory: ${{ runner.temp }}/foundation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          "$RUNNER_TEMP/foundation/runtime/bun-linux-x64-baseline/bun" \
            --no-env-file --no-install "$RUNNER_TEMP/foundation/checker/agent-config/bin/foundation-check.ts" \
            review --repo "$GITHUB_WORKSPACE" --pr "$PR_NUMBER"
