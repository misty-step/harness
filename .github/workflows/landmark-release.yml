name: Verify and Release
on:
  push:
    branches: [master]
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Landmark
        uses: misty-step/landmark@d3b07452500e6cdf3ddead1c11ba5584287a80c9
        with:
          mode: full
          github-token: ${{ github.token }}
          node-version: '24'
          synthesis: 'false'
          healthcheck: 'false'
