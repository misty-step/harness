name: CI
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, hetzner-ci, mistystack-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install the pinned gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          bin_dir="$RUNNER_TEMP/gitleaks-bin"
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-connrefused --location --silent --show-error --fail \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" gitleaks
          "$bin_dir/gitleaks" version
          echo "$bin_dir" >> "$GITHUB_PATH"
      - name: Install the pinned Landmark
        env:
          # Keep in step with the Landmark action pinned in landmark-release.yml.
          LANDMARK_VERSION: '0.28.9'
          LANDMARK_SHA256: 7a22cba7d99aa6d05ef113a8ff95ca5ca6098c6bf4a8af213f85370fa30e65d2
        run: |
          bin="$RUNNER_TEMP/landmark"
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-connrefused --location --silent --show-error --fail \
            "https://github.com/misty-step/landmark/releases/download/v${LANDMARK_VERSION}/landmark-x86_64-unknown-linux-musl" -o "$bin"
          printf '%s  %s\n' "$LANDMARK_SHA256" "$bin" | sha256sum --check --strict
          chmod +x "$bin"
          echo "LANDMARK_BIN=$bin" >> "$GITHUB_ENV"
      - name: Check CHANGELOG.md against protected publication
        # PRs only: master's publish job already runs this check, and a GitHub outage
        # here would skip publication of a landed release (#348).
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/protected-release-check.ts
      - name: Check strict plugin structure and all maintained tests (no runtime install)
        run: ./scripts/check plugin --strict --lint-only
