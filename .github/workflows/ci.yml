name: CI
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Local-only validation uses the same candidate classifier as publication.
      # Any newly generated changelog stays in this disposable checkout.
      - name: Validate protected release candidate before merge
        uses: misty-step/landmark@0be932f9fd775f826427eb5ada2f24efb9a393d8 # v0.28.9
        with:
          mode: prepare-protected
          github-token: ${{ github.token }}
          synthesis: 'false'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Check workspace and all components sequentially
        run: ./scripts/check all
      - name: System One semantic review gate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            bun omp-config/bin/omp-diff-review.ts --range "origin/${{ github.base_ref }}..HEAD" --strict
          elif [ -n "$OPENROUTER_API_KEY" ]; then
            bun omp-config/bin/omp-diff-review.ts --commit HEAD --strict
          else
            echo "Semantic review gate skipped in uncredentialed CI run."
          fi
