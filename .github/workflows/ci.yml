name: CI
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Check workspace and all components sequentially
        run: ./scripts/verify all
      - name: System One semantic review gate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            bun omp-config/bin/omp-diff-review.ts --range "origin/${{ github.base_ref }}..HEAD" --strict
          elif [ -n "$OPENROUTER_API_KEY" ]; then
            bun omp-config/bin/omp-diff-review.ts --commit HEAD --strict
          else
            echo "Semantic review gate skipped in uncredentialed CI run."
          fi
      - name: Advisory test-evidence check on exact CI snapshot
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          OPENROUTER_API_KEY: '' # Never expose a credential to PR-controlled code.
          TYPESAFE_API_KEY: ''
        run: |
          if ! base=$(git merge-base HEAD "origin/$GITHUB_BASE_REF"); then
            echo "semantic-check: comparison base unavailable; deterministic gate result is unchanged"
            exit 0
          fi
          head=$(git rev-parse HEAD)
          printf 'refs/heads/ci %s refs/heads/base %s\n' "$head" "$base" |
            bun agent-config/bin/semantic-check.ts --repo "$PWD" --outgoing --json --no-cache ||
            echo "semantic-check: advisory unavailable; deterministic gate result is unchanged"
