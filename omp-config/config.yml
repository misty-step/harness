modelRoles:
  default: anthropic/claude-opus-5-5:medium
  slow: anthropic/claude-opus-5-5:xhigh
  extreme: anthropic/claude-opus-5-5:max
  plan: anthropic/claude-opus-5-5:high
  advisor: openai-codex/gpt-6-luna:max
  task: anthropic/claude-opus-5-5:medium
  reviewer: anthropic/claude-opus-5-5:high
  security-reviewer: openai-codex/gpt-6-astra:max
  vision: anthropic/claude-opus-5-5:high
  smol: openai-codex/gpt-6-luna:max
  tiny: openai-codex/gpt-6-luna:max
  commit: openai-codex/gpt-6-luna:max
cycleOrder: [smol, default, extreme]
symbolPreset: nerd
theme:
  dark: omarchy-system
  light: omarchy-system
statusLine:
  preset: custom
  separator: none
  transparent: true
  sessionAccent: true
  compactThinkingLevel: true
  showHookStatus: false
  leftSegments:
    - status
    - model
    - git
    - mode
    - subagents
  rightSegments:
    - session_name
    - context_pct
    - cost
  segmentOptions:
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
tui:
  tight: false
  hyperlinks: auto
  renderMermaid: true
  scrollbackRebuild: true
  titleState: true
display:
  shimmer: classic
  smoothStreaming: true
  showTokenUsage: true
  cacheMissMarker: true
browser:
  relay: true
  headless: true
  cmux: false
setupVersion: 2
composer:
  shape: pi
skills:
  enableAgentsUser: true
github:
  enabled: true
secrets:
  enabled: true
tools:
  approvalMode: yolo
advisor:
  enabled: true
  syncBacklog: "off"
providers:
  tinyModel: lfm2-350m
  webSearchOrder:
    - exa
retry:
  fallbackChains:
    advisor:
      - google-antigravity/gemini-3.8-flash:high
      - xai-oauth/grok-4.7:xhigh
      - openrouter/deepseek/deepseek-v4.1-flash:max
    default:
      - openai-codex/gpt-6-sol:xhigh
      - openai-codex/gpt-6-luna:max
      - anthropic/claude-opus-5-5:medium
      - xai-oauth/grok-4.7:xhigh
      - openrouter/deepseek/deepseek-v4.1-flash:max
    plan:
      - openai-codex/gpt-6-astra:high
      - openai-codex/gpt-6-sol:xhigh
      - xai-oauth/grok-4.7:xhigh
      - openrouter/deepseek/deepseek-v4.1-flash:max
    slow:
      - openai-codex/gpt-6-astra:high
      - openai-codex/gpt-6-sol:xhigh
      - xai-oauth/grok-4.7:xhigh
      - openrouter/deepseek/deepseek-v4.1-flash:max
    extreme:
      - openai-codex/gpt-6-astra:max
      - openai-codex/gpt-6-sol:xhigh
      - xai-oauth/grok-4.7:xhigh
      - openrouter/deepseek/deepseek-v4.1-flash:max
    security-reviewer:
      - anthropic/claude-opus-5-5:high
      - openai-codex/gpt-6-sol:xhigh
      - xai-oauth/grok-4.7:xhigh
      - openrouter/deepseek/deepseek-v4.1-flash:max
    vision:
      - openai-codex/gpt-6-sol:xhigh
      - openai-codex/gpt-6-luna:max
      - xai-oauth/grok-4.7:xhigh
      - openrouter/deepseek/deepseek-v4.1-flash:max
    smol:
      - anthropic/claude-opus-5-5:medium
      - xai-oauth/grok-4.7:xhigh
      - openrouter/deepseek/deepseek-v4.1-flash:max
    tiny:
      - anthropic/claude-opus-5-5:medium
      - xai-oauth/grok-4.7:xhigh
      - openrouter/deepseek/deepseek-v4.1-flash:max
    commit:
      - anthropic/claude-opus-5-5:medium
      - xai-oauth/grok-4.7:xhigh
      - openrouter/deepseek/deepseek-v4.1-flash:max
task:
  maxRecursionDepth: 3
  showResolvedModelBadge: true
  enableLsp: true
  # Opt-in per task item (`isolated: true`). Workspaces are copy-on-write under
  # ~/.omp/wt (btrfs/reflink on this host) and removed when the child yields;
  # no git worktree is registered. 0e0083c disabled this when `auto` produced
  # real worktrees that /tmp aging reaped; re-probed on omp 18.2.11.
  isolation:
    enabled: true
    apply: true
    merge: patch
  agentModelOverrides:
    task: "@task"
    scout: "@smol"
    sonic: "@smol"
    reviewer: "@reviewer"
    security-reviewer: "@security-reviewer"
isolation:
  backend: auto
