modelRoles:
  default: openai-codex/gpt-6.1-sol:xhigh
  slow: anthropic/claude-opus-5-5:high
  extreme: anthropic/claude-opus-5-5:xhigh
  plan: openai-codex/gpt-6-astra:xhigh
  advisor: cursor/grok-4.7:xhigh
  task: openai-codex/gpt-6.1-sol:xhigh
  reviewer: anthropic/claude-opus-5-5:xhigh
  security-reviewer: openai-codex/gpt-6.1-sol:xhigh
  vision: anthropic/claude-opus-5-5:high
  smol: openai-codex/gpt-6.1-sol:low
  tiny: openai-codex/gpt-6.1-sol:low
  commit: openai-codex/gpt-6.1-sol:low
  web: web/exa
find:
  credentialProvider: openrouter-find
cycleOrder: [smol, default, extreme]
symbolPreset: nerd
theme:
  dark: omarchy-system
  light: omarchy-system
statusLine:
  preset: custom
  separator: none
  transparent: true
  sessionAccent: true
  compactThinkingLevel: true
  showHookStatus: false
  leftSegments:
    - status
    - model
    - git
    - mode
    - subagents
  rightSegments:
    - session_name
    - context_pct
    - cost
  segmentOptions:
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
tui:
  tight: false
  hyperlinks: auto
  renderMermaid: true
  scrollbackRebuild: true
  titleState: true
display:
  shimmer: classic
  smoothStreaming: true
  showTokenUsage: true
  cacheMissMarker: true
browser:
  relay: true
  headless: true
  cmux: false
setupVersion: 2
composer:
  shape: pi
skills:
  enableAgentsUser: true
github:
  enabled: true
secrets:
  enabled: true
tools:
  approvalMode: yolo
advisor:
  enabled: false
  syncBacklog: "off"
providers:
  webSearchOrder:
    - exa
auth:
  # Shared subscription pool; native usage/reserve checks still apply.
  accountPolicies:
    - provider: anthropic
      account:
        email: phaedrus@r90.dev
      priority: 1
    - provider: openai-codex
      account:
        email: phaedrus@r90.dev
      priority: 1
retry:
  fallbackChains:
    # Model keys outrank role chains, including a main session's `default`.
    # No effort suffix: every Opus 5.5 reasoning level stops on an outage.
    anthropic/claude-opus-5-5: []
    advisor:
      - openai-codex/gpt-6.1-sol:xhigh
      - cursor/claude-sonnet-5-5:high
      - google-antigravity/gemini-3.8-flash:high
    # Web search recovery stays on search providers, never retired chat models.
    web:
      - web/parallel
      - web/perplexity
      - web/zai
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/synthetic
      - web/ollama
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public
    # Builders recover to Astra; specialist routes retain high reasoning.
    default:
      - openai-codex/gpt-6-astra:xhigh
      - cursor/claude-sonnet-5-5:high
      - anthropic/claude-sonnet-5-5:high
    task:
      - openai-codex/gpt-6-astra:xhigh
      - cursor/claude-sonnet-5-5:high
      - anthropic/claude-sonnet-5-5:high
    plan:
      - openai-codex/gpt-6.1-sol:xhigh
      - anthropic/claude-opus-5-5:xhigh
    reviewer: []
    slow:
      - openai-codex/gpt-6.1-sol:xhigh
    extreme: []
    security-reviewer: []
    vision: []
    smol:
      - anthropic/claude-sonnet-5-5:medium
      - google-antigravity/gemini-3.8-flash:high
    tiny:
      - anthropic/claude-sonnet-5-5:medium
      - google-antigravity/gemini-3.8-flash:high
    commit:
      - anthropic/claude-sonnet-5-5:medium
      - google-antigravity/gemini-3.8-flash:high
task:
  maxRecursionDepth: 3
  showResolvedModelBadge: true
  enableEffort: true
  enableLsp: true
  # The supported specialist guard enables these only after initialization.
  disabledAgents:
    - reviewer
    - security-reviewer
    - designer
  # Opt-in per task item (`isolated: true`). Workspaces are copy-on-write under
  # ~/.omp/wt (btrfs/reflink on this host) and removed when the child yields;
  # no git worktree is registered. 0e0083c disabled this when `auto` produced
  # real worktrees that /tmp aging reaped; re-probed on omp 18.2.11.
  isolation:
    enabled: true
    apply: true
    merge: patch
  agentModelOverrides:
    task: "@task"
    scout: "@smol"
    sonic: "@smol"
    reviewer: "@reviewer"
    security-reviewer: "@security-reviewer"
isolation:
  backend: auto
