modelRoles:
  default: anthropic/claude-opus-5-5:medium
  slow: anthropic/claude-opus-5-5:xhigh
  extreme: anthropic/claude-opus-5-5:max
  plan: openai-codex/gpt-6-astra:high
  advisor: anthropic/claude-sonnet-5-5:medium
  task: openai-codex/gpt-6-sol:max
  reviewer: openai-codex/gpt-6-astra:high
  security-reviewer: openai-codex/gpt-6-astra:max
  vision: anthropic/claude-opus-5-5:high
  smol: openai-codex/gpt-6-luna:max
  tiny: openai-codex/gpt-6-luna:max
  commit: openai-codex/gpt-6-luna:max
  web: web/exa
cycleOrder: [smol, default, extreme]
symbolPreset: nerd
theme:
  dark: omarchy-system
  light: omarchy-system
statusLine:
  preset: custom
  separator: none
  transparent: true
  sessionAccent: true
  compactThinkingLevel: true
  showHookStatus: false
  leftSegments:
    - status
    - model
    - git
    - mode
    - subagents
  rightSegments:
    - session_name
    - context_pct
    - cost
  segmentOptions:
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
tui:
  tight: false
  hyperlinks: auto
  renderMermaid: true
  scrollbackRebuild: true
  titleState: true
display:
  shimmer: classic
  smoothStreaming: true
  showTokenUsage: true
  cacheMissMarker: true
browser:
  relay: true
  headless: true
  cmux: false
setupVersion: 2
composer:
  shape: pi
skills:
  enableAgentsUser: true
github:
  enabled: true
secrets:
  enabled: true
tools:
  approvalMode: yolo
advisor:
  enabled: true
  syncBacklog: "off"
providers:
  webSearchOrder:
    - exa
retry:
  fallbackChains:
    # Model keys outrank role chains, including a main session's `default`.
    # No effort suffix: every Opus 5.5 reasoning level stops on an outage.
    anthropic/claude-opus-5-5: []
    advisor:
      - openai-codex/gpt-6-sol:medium
      - xai-oauth/grok-4.7:xhigh
      - google-antigravity/gemini-3.8-flash:high
    # Web search recovery stays on search providers, never retired chat models.
    web:
      - web/parallel
      - web/perplexity
      - web/zai
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/synthetic
      - web/ollama
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public
    default:
      - openai-codex/gpt-6-sol:max
      - openai-codex/gpt-6-luna:max
      - anthropic/claude-opus-5-5:medium
      - xai-oauth/grok-4.7:xhigh
    task:
      - openai-codex/gpt-6-luna:max
      - anthropic/claude-opus-5-5:medium
      - xai-oauth/grok-4.7:xhigh
    plan:
      - anthropic/claude-opus-5-5:high
      - openai-codex/gpt-6-sol:max
      - xai-oauth/grok-4.7:xhigh
    reviewer:
      - anthropic/claude-opus-5-5:high
      - openai-codex/gpt-6-sol:max
      - xai-oauth/grok-4.7:xhigh
    slow:
      - openai-codex/gpt-6-astra:high
      - openai-codex/gpt-6-sol:max
      - xai-oauth/grok-4.7:xhigh
    extreme:
      - openai-codex/gpt-6-astra:max
      - openai-codex/gpt-6-sol:max
      - xai-oauth/grok-4.7:xhigh
    security-reviewer:
      - anthropic/claude-opus-5-5:high
      - openai-codex/gpt-6-sol:max
      - xai-oauth/grok-4.7:xhigh
    # Dedicated vision consumers also retain an Opus-only chain.
    vision:
      - anthropic/claude-opus-5-5:xhigh
    smol:
      - anthropic/claude-opus-5-5:medium
      - xai-oauth/grok-4.7:xhigh
    tiny:
      - anthropic/claude-opus-5-5:medium
      - xai-oauth/grok-4.7:xhigh
    commit:
      - anthropic/claude-opus-5-5:medium
      - xai-oauth/grok-4.7:xhigh
task:
  maxRecursionDepth: 3
  showResolvedModelBadge: true
  enableEffort: true
  enableLsp: true
  # Opt-in per task item (`isolated: true`). Workspaces are copy-on-write under
  # ~/.omp/wt (btrfs/reflink on this host) and removed when the child yields;
  # no git worktree is registered. 0e0083c disabled this when `auto` produced
  # real worktrees that /tmp aging reaped; re-probed on omp 18.2.11.
  isolation:
    enabled: true
    apply: true
    merge: patch
  agentModelOverrides:
    task: "@task"
    scout: "@smol"
    sonic: "@smol"
    reviewer: "@reviewer"
    security-reviewer: "@security-reviewer"
isolation:
  backend: auto
