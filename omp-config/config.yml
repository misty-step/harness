modelRoles:
  default: openai-codex/gpt-6.1-sol:xhigh
  slow: openai-codex/gpt-6.1-sol:xhigh
  extreme: openai-codex/gpt-6.1-sol:xhigh
  plan: openai-codex/gpt-6.1-sol:xhigh
  advisor: openai-codex/gpt-6.1-sol:xhigh
  task: openai-codex/gpt-6.1-sol:xhigh
  reviewer: anthropic/claude-sonnet-5-5:high
  security-reviewer: anthropic/claude-sonnet-5-5:high
  vision: anthropic/claude-opus-5-5:high
  smol: openai-codex/gpt-6.1-sol:xhigh
  tiny: openai-codex/gpt-6.1-sol:xhigh
  commit: openai-codex/gpt-6.1-sol:xhigh
  web: web/exa
defaultThinkingLevel: xhigh
tier:
  openai: priority
  subagent: inherit
find:
  credentialProvider: openrouter-find
theme:
  dark: everforest
  light: everforest-light
browser:
  relay: true
  headless: true
  cmux: false
skills:
  enableAgentsUser: true
github:
  enabled: true
secrets:
  enabled: true
tools:
  approvalMode: yolo
advisor:
  enabled: false
  syncBacklog: "off"
providers:
  webSearchOrder:
    - exa
retry:
  fallbackChains:
    # Model keys outrank role chains, including a main session's `default`.
    # No effort suffix: every Opus 5.5 reasoning level stops on an outage.
    anthropic/claude-opus-5-5: []
    advisor:
      - cursor/claude-sonnet-5-5:high
    # Web search recovery stays on search providers, never retired chat models.
    web:
      - web/parallel
      - web/perplexity
      - web/zai
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/synthetic
      - web/ollama
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public
    # Builders recover to Astra; specialist routes retain high reasoning.
    default:
      - openai-codex/gpt-6-astra:xhigh
      - cursor/claude-sonnet-5-5:high
      - anthropic/claude-sonnet-5-5:high
    task:
      - openai-codex/gpt-6-astra:xhigh
      - cursor/claude-sonnet-5-5:high
      - anthropic/claude-sonnet-5-5:high
    reviewer: []
    security-reviewer: []
    vision: []
task:
  maxRecursionDepth: 3
  showResolvedModelBadge: true
  enableEffort: true
  enableLsp: true
  # The supported specialist guard enables these only after initialization.
  disabledAgents:
    - reviewer
    - security-reviewer
    - designer
  # Opt-in per task item (`isolated: true`). Workspaces are copy-on-write under
  # ~/.omp/wt (btrfs/reflink on this host) and removed when the child yields;
  # no git worktree is registered. 0e0083c disabled this when `auto` produced
  # real worktrees that /tmp aging reaped; re-probed on omp 18.2.11.
  isolation:
    enabled: true
    apply: true
    merge: patch
  agentModelOverrides:
    task: "@task"
    scout: "@advisor"
    sonic: "@smol"
    reviewer: "@reviewer"
    security-reviewer: "@security-reviewer"
isolation:
  backend: auto
