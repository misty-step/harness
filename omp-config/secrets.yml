# managed by misty-step/harness omp-config/secrets.yml
# OMP secret-masking policy (US-039). OMP replaces each match with a reversible
# placeholder before text reaches a model provider and restores it when a tool
# runs. Regex entries only: a plain entry would commit a secret to Git. Put
# machine-local plain entries in a project .omp/secrets.yml instead.
- type: regex
  friendlyName: Env credential
  content: |-
    (?<=\b[A-Z][A-Z0-9_]*(?:KEY|TOKEN|SECRET|PASSWORD|PASSWD|PASS|AUTH|CREDENTIAL|PRIVATE)[A-Z0-9_]*["']?\s*[=:]\s*)(?:"[^"\n]{8,}"|'[^'\n]{8,}'|[^\s"']{8,})
- type: regex
  friendlyName: URL password
  content: |-
    (?<=[A-Za-z][A-Za-z0-9+.-]*://[^\s/:@]+:)[^\s@/]{8,}(?=@)
