# Cloud models stay in the bundled catalog; override only OpenRouter auth.
providers:
  ollama:
    baseUrl: "http://127.0.0.1:11434"
    auth: none
    api: openai-responses
    discovery:
      type: ollama
  openrouter:
    apiKey: "!openrouter-key --personal workstation/OPENROUTER_OMP_HARNESS_API_KEY"
