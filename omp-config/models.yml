# Cloud models stay in the bundled catalog; override only OpenRouter auth.
providers:
  ollama:
    baseUrl: "http://127.0.0.1:11434"
    auth: none
    api: openai-responses
    discovery:
      type: ollama
  openrouter:
    apiKey: "!openrouter-key --personal workstation/OPENROUTER_MISTY_STEP_HARNESS_WORKSTATION_DIFF_REVIEW_API_KEY"
  openrouter-find:
    apiKey: "!openrouter-key --personal workstation/OPENROUTER_MISTY_STEP_HARNESS_WORKSTATION_FIND_API_KEY"
