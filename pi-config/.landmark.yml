product:
  name: pi-config
  description: Pi coding-agent configuration for Phaedrus and Misty Step. Source of truth for pi settings, composer chrome, and the LOC status extension.
audience: general
voice: clear, specific, user-facing
changelog:
  source: auto
artifacts:
  markdown: docs/releases/{version}.md
  json: docs/releases/releases.json
release:
  profile: full
model:
  policy: balanced
budget:
  max_input_tokens: 12000
  max_output_tokens: 1200
